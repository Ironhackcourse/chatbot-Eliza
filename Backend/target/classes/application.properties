# =====================================================
# Configuración de la conexión a la base de datos
# =====================================================

# URL de conexión: driver + host + puerto + nombre de la base de datos
# (En este caso: MariaDB/MySQL en localhost, puerto 3306, BD "eliza_db")
spring.datasource.url=jdbc:mariadb://localhost:3306/eliza_db

# Usuario y contraseña para acceder a la base de datos
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC de MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =====================================================
# Configuración de JPA / Hibernate
# =====================================================

# Acción sobre el esquema: "update" crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en consola (útil para depuración)
spring.jpa.show-sql=true

# Dialecto de Hibernate para MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# =====================================================
# Inicialización del esquema con schema.sql
# =====================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Puerto del servidor backend
server.port=8080

# Directorio donde Spring Boot busca los recursos estáticos del frontend
# (Ahora los archivos se encuentran en la carpeta Frontend/ del proyecto)
spring.web.resources.static-locations=file:/home/xavier/Documentos/IronHack/ChatEli/Frontend/
